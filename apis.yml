aid: 458energy
name: 45-8 ENERGY
description: >-
  45-8 ENERGY is a French exploration and production company, founded in 2017 and
  headquartered in Metz with offices in Lyon, dedicated to helium and natural (native)
  hydrogen in Europe. It is the first company in France and Western Europe specialised in
  the exploration and production of these two low-carbon subsurface gases, covering the
  full value chain from geoscientific exploration through production, distribution and
  recycling. In 2024 it delivered the first helium produced on Western European soil, and
  it operates RECYCL'He, Europe's first mobile helium recovery and recycling unit. Its
  exploration and production portfolio spans France (Fonts-Bouillants, Avant-Monts,
  Marensin, Beauvoir), Germany (Guhlen, Brimir), the Balkans and the United States
  (Humboldt, Fayette). In April 2026 Ad Terra took a majority stake in the company. 45-8
  ENERGY is a physical-resources operator and publishes no developer program, public API,
  SDK or machine-readable data surface.
